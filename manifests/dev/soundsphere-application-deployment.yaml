apiVersion: apps/v1
kind: Deployment
metadata:
  name: soundsphere-application
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: soundsphere-application
  template:
    metadata:
      labels:
        app: soundsphere-application
    spec:
      imagePullSecrets:
        - name: docker-reg-cred
      containers:
      - name: soundsphere-application
        image: tientran0826/soundsphere-application-dev:latest
        imagePullPolicy: Always
        envFrom:
          - secretRef:
              name: soundsphere-secrets-dev
