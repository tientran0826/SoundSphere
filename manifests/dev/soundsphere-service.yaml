apiVersion: v1
kind: Service
metadata:
  name: soundsphere-bot
  namespace: dev
spec:
  selector:
    app: soundsphere-bot
  type: NodePort
  ports:
    - name: flask-public
      protocol: TCP
      port: 8000        # external port
      targetPort: 8000  # container Flask port
      nodePort: 30079   # NodePort for external access
