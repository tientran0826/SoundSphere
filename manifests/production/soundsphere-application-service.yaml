apiVersion: v1
kind: Service
metadata:
  name: soundsphere-application
  namespace: production
spec:
  selector:
    app: soundsphere-application
  type: NodePort
  ports:
    - name: flask
      protocol: TCP
      port: 8000        # external port
      targetPort: 8000  # container Flask port
      nodePort: 30080    # NodePort for external access
