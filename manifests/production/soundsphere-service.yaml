apiVersion: v1
kind: Service
metadata:
  name: soundsphere-bot
  namespace: production
spec:
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
    - name: api-control
      protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30269
  type: NodePort
