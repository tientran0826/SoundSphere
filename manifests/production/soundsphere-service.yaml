apiVersion: v1
kind: Service
metadata:
  name: soundsphere-bot
  namespace: dev
spec:
  selector:
    app: soundsphere-bot
  type: NodePort
  ports:
    - name: flask
      protocol: TCP
      port: 8000        # external port
      targetPort: 8000  # container Flask port
      nodePort: 30080    # NodePort for external access
    - name: fastapi
      protocol: TCP
      port: 5000        # external port
      targetPort: 5000  # container Flask port
      nodePort: 30081    # NodePort for external access
