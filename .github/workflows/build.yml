name: Build & Push Docker

on:
  push:
    branches: ["develop", "production"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Step 1: Login to Docker
      - name: Login Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 2: Set Docker tag based on branch
      - name: Set Docker tag
        id: set-tag
        run: |
          DOCKER_REPO="${{ secrets.DOCKERHUB_USERNAME }}"

          if [ "${{ github.ref_name }}" == "production" ]; then
            echo "TAG=${DOCKER_REPO}/soundsphere-bot:latest" >> $GITHUB_ENV
          else
            echo "TAG=${DOCKER_REPO}/soundsphere-bot-dev:latest" >> $GITHUB_ENV
          fi

      # Step 3: Build & Push Docker image
      - name: Build & Push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.TAG }}
