name: Build & Push Docker

on:
  push:
    branches: ["develop", "production"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Docker tag
        run: |
          DOCKER_REPO="${{ secrets.DOCKERHUB_USERNAME }}"
          if [ "${{ github.ref_name }}" == "production" ]; then
            TAG="${DOCKER_REPO}/soundsphere-bot:latest"
          else
            TAG="${DOCKER_REPO}/soundsphere-bot-dev:latest"
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Build & Push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.TAG }}

      - name: Trigger Argo CD sync
        run: |
          if [ "${{ github.ref_name }}" == "production" ]; then
            APP_NAME="soundsphere"
          else
            APP_NAME="soundsphere-dev"
          fi

          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.ARGOCD_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"prune":true,"force":true,"replace":true}' \
            https://argocd.castl.io.vn/api/v1/applications/$APP_NAME/sync
