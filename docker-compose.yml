version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: music_postgres
    restart: always
    environment:
      POSTGRES_USER: music_admin
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: music_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
