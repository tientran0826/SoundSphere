services:
  postgres:
    image: postgres:15
    container_name: music_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  soundsphere-bot:
    build: .
    container_name: soundsphere_bot
    restart: always
    env_file:
      - .env
    depends_on:
      - postgres

volumes:
  postgres_data:
